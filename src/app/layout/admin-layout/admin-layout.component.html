<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="admin-sidebar-logo d-flex justify-content-between align-items-center">
      <a routerLink="/" class="text-decoration-none text-rb-primary">
        <i class="bi bi-bus-front me-2"></i>
        <span class="logo-text" *ngIf="!isSidebarCollapsed">BusTicket</span>
      </a>
      <button class="btn btn-link text-white d-md-none p-0" (click)="toggleSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="admin-sidebar-user" *ngIf="!isSidebarCollapsed">
      <div class="user-avatar-lg">{{ userName.charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">{{ panelTitle }}</div>
      </div>
    </div>

    <nav class="admin-nav mt-3">
      <a *ngFor="let item of currentNavItems" 
         [routerLink]="item.route" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{exact: item.route === '/admin' || item.route === '/operator'}"
         class="admin-nav-link"
         [title]="item.label">
        <i class="bi" [ngClass]="item.icon"></i>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
      </a>
    </nav>
    
    <div class="admin-nav mt-auto pb-4">
      <a href="javascript:void(0)" class="admin-nav-link text-danger" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-content" [class.expanded]="isSidebarCollapsed">
    <header class="admin-header">
      <div class="d-flex align-items-center">
        <button class="btn btn-link text-dark p-0 me-3 d-none d-md-block" (click)="toggleSidebar()">
          <i class="bi bi-list fs-4"></i>
        </button>
        <button class="btn btn-link text-dark p-0 me-3 d-md-none" (click)="toggleSidebar()">
          <i class="bi bi-list fs-4"></i>
        </button>
        <h4 class="mb-0">{{ panelTitle }}</h4>
      </div>
      
      <div class="header-actions">
        <a routerLink="/" class="btn btn-outline-secondary btn-sm rounded-pill">
          <i class="bi bi-box-arrow-up-right me-1"></i>View Site
        </a>
      </div>
    </header>

    <div class="admin-content-inner">
      <router-outlet></router-outlet>
    </div>
    
    <footer class="admin-footer">
      <p class="mb-0 text-muted small">&copy; {{ currentYear }} Bus Ticket Booking System</p>
    </footer>
  </main>
</div>
