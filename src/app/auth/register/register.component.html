<div class="register-page">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-12 col-sm-10 col-md-7 col-lg-5">

        <div class="card register-card border-0 shadow-sm">

          <div class="card-body p-4 p-md-5">

            <!-- TITLE -->

            <div class="text-center mb-4">

              <h3 class="fw-bold">
                Create Account
              </h3>

              <p class="text-secondary mb-0">
                Register to book your bus journey
              </p>

            </div>


            <!-- ERROR -->

            @if (errorMessage()) {

            <div class="alert alert-danger">
              {{ errorMessage() }}
            </div>

            }


            <!-- SUCCESS -->

            @if (successMessage()) {

            <div class="alert alert-success">
              {{ successMessage() }}
            </div>

            }


            <form (ngSubmit)="register()">

              <!-- NAME -->

              <div class="mb-3">

                <label for="name" class="form-label fw-semibold">

                  Name

                </label>

                <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name"
                  [(ngModel)]="registerData.fullName">

              </div>


              <!-- EMAIL -->

              <div class="mb-3">

                <label for="email" class="form-label fw-semibold">

                  Email

                </label>

                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                  [(ngModel)]="registerData.email">

              </div>


              <!-- PHONE -->

              <div class="mb-3">

                <label for="phone" class="form-label fw-semibold">

                  Phone

                </label>

                <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number"
                  [(ngModel)]="registerData.mobileNumber">

              </div>


              <!-- PASSWORD -->

              <div class="mb-3">

                <label for="password" class="form-label fw-semibold">

                  Password

                </label>

                <input type="password" id="password" name="password" class="form-control"
                  placeholder="Enter your password" [(ngModel)]="registerData.password">

              </div>


              <!-- CONFIRM PASSWORD -->

              <div class="mb-4">

                <label for="confirmPassword" class="form-label fw-semibold">

                  Confirm Password

                </label>

                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                  placeholder="Confirm your password" [(ngModel)]="registerData.confirmPassword">

              </div>


              <!-- REGISTER BUTTON -->

              <button type="submit" class="btn btn-danger w-100" [disabled]="loading()">

                @if (loading()) {

                <span class="spinner-border spinner-border-sm me-2">
                </span>

                Registering...

                } @else {

                Register

                }

              </button>

            </form>


            <!-- LOGIN -->

            <div class="text-center mt-4">

              <span class="text-secondary">
                Already have an account?
              </span>

              <a routerLink="/login" class="text-danger text-decoration-none fw-semibold ms-1">

                Login

              </a>

            </div>


            <!-- BROWSE -->

            <div class="text-center mt-3">

              <a routerLink="/" class="browse-link">

                <i class="bi bi-bus-front me-2"></i>

                Continue browsing buses

              </a>

            </div>


          </div>

        </div>

      </div>

    </div>

  </div>

</div>
