<div class="bg-light min-vh-100 d-flex align-items-center">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-12 col-sm-10 col-md-6 col-lg-4">

        <div class="card border-0 shadow-sm">

          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

              <h3 class="fw-bold">
                Login
              </h3>

              <p class="text-secondary mb-0">
                Login to continue your journey
              </p>

            </div>


            @if (errorMessage()) {

            <div class="alert alert-danger">
              {{ errorMessage() }}
            </div>

            }


            <form (ngSubmit)="login()">

              <!-- Email -->

              <div class="mb-3">

                <label for="email" class="form-label fw-semibold">

                  Email

                </label>

                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                  [(ngModel)]="loginData.email">

              </div>


              <!-- Password -->

              <div class="mb-4">

                <label for="password" class="form-label fw-semibold">

                  Password

                </label>

                <input type="password" id="password" name="password" class="form-control"
                  placeholder="Enter your password" [(ngModel)]="loginData.password">

              </div>


              <!-- Login -->

              <button type="submit" class="btn btn-danger w-100" [disabled]="loading()">

                @if (loading()) {

                <span class="spinner-border spinner-border-sm me-2"></span>

                Logging in...

                } @else {

                Login

                }

              </button>



            </form>


            <div class="text-center mt-4">

              <span class="text-secondary">
                Don't have an account?
              </span>

              <a routerLink="/register" class="text-danger text-decoration-none fw-semibold ms-1">

                Register

              </a>

            </div>

            <div class="text-center mt-3">

              <a routerLink="/" class="browse-link">

                <i class="bi bi-bus-front me-2"></i>

                Continue browsing buses

              </a>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
